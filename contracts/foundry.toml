[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 2000
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
